[package]
name = "rustydotmatrix"
version = "0.1.0"
edition = "2021"
description = "Proof of concept: view raw 9-pin dot matrix printer (ESC/P) data as dots, with zoom. Rust + egui + wgpu."

[dependencies]
# eframe 0.32 is pinned on purpose: the egui API changes between releases.
eframe = { version = "0.32", default-features = false, features = [
    "default_fonts",
    "wgpu",
    "x11",
    "wayland",
] }
rfd = "0.15"

# eframe's "wgpu" feature alone enables NO graphics backend in this version
# (the app panics with "No wgpu backend feature ... was enabled"), so turn the
# platform backends on explicitly. Keep this major version equal to the one
# eframe 0.32 uses.
wgpu = { version = "25", default-features = false, features = ["dx12", "vulkan", "metal"] }

# Keep debug builds usable: optimise dependencies (egui, wgpu) even in dev.
[profile.dev.package."*"]
opt-level = 2

[profile.release]
opt-level = 3
